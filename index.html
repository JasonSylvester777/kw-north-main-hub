<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#b8142f" />
  <meta name="robots" content="noindex,nofollow" />
  <title>KW North Agent Hub — Prototype</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-block">
        <div class="brand-mark">KW</div>
        <div>
          <div class="brand-name">KW NORTH</div>
          <div class="brand-caption">Agent Hub</div>
        </div>
      </div>

      <nav class="side-nav" aria-label="Main navigation">
        <button class="nav-item active" data-view="home"><span>⌂</span><span>Home</span></button>
        <button class="nav-item" data-view="business"><span>◫</span><span>My Business</span></button>
        <button class="nav-item" data-view="tools"><span>▦</span><span>Tools & Systems</span></button>
        <button class="nav-item" data-view="transactions"><span>✓</span><span>Transactions</span></button>
        <button class="nav-item" data-view="farm"><span>⌖</span><span>My Farming Area</span></button>
        <button class="nav-item" data-view="calendar"><span>□</span><span>Calendar</span></button>
        <button class="nav-item" data-view="training"><span>▶</span><span>Training Academy</span></button>
        <button class="nav-item" data-view="accountability"><span>↗</span><span>Accountability</span></button>
        <button class="nav-item" data-view="resources"><span>≡</span><span>Resources</span></button>
        <button class="nav-item" data-view="onboarding"><span>◎</span><span>Onboarding</span></button>
        <button class="nav-item" data-view="support"><span>?</span><span>Support</span></button>
      </nav>

      <div class="sidebar-foot">
        <div class="pilot-badge">KW North Pilot</div>
        <p>Prototype environment</p>
      </div>
    </aside>

    <div class="main-shell">
      <header class="topbar">
        <button class="mobile-brand" data-view="home" aria-label="Home">
          <span class="mobile-brand-mark">KW</span>
          <span><strong>KW North</strong><small>Agent Hub</small></span>
        </button>

        <div class="search-wrap">
          <span>⌕</span>
          <input id="globalSearch" type="search" placeholder="Search tools, training, scripts, documents…" />
          <kbd>⌘ K</kbd>
        </div>

        <div class="top-actions">
          <button class="icon-btn" id="notificationBtn" aria-label="Notifications">◉<span class="notification-dot"></span></button>
          <button class="profile-chip" data-view="profile">
            <span class="avatar">JS</span>
            <span class="profile-copy"><strong>Jason</strong><small>Agent</small></span>
            <span>⌄</span>
          </button>
        </div>
      </header>

      <main id="viewRoot" class="view-root"></main>
    </div>

    <nav class="mobile-nav" aria-label="Mobile navigation">
      <button class="mobile-nav-item active" data-view="home"><span>⌂</span><small>Home</small></button>
      <button class="mobile-nav-item" data-view="tools"><span>▦</span><small>Tools</small></button>
      <button class="mobile-nav-item" data-view="farm"><span>⌖</span><small>Farm</small></button>
      <button class="mobile-nav-item" data-view="calendar"><span>□</span><small>Calendar</small></button>
      <button class="mobile-nav-item" data-view="more"><span>•••</span><small>More</small></button>
    </nav>
  </div>

  <div class="toast" id="toast"></div>
  <div class="command-palette" id="commandPalette" aria-hidden="true">
    <div class="palette-panel">
      <div class="palette-search"><span>⌕</span><input id="paletteInput" placeholder="Where do you want to go?" /></div>
      <div class="palette-results" id="paletteResults"></div>
      <div class="palette-footer">Prototype navigation • Links will be connected after design approval</div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="training-links.js"></script>
</body>
</html>
